name: Client SDK CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  rest-ios-lua:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo test --locked --manifest-path runtime/rust/Cargo.toml
      - run: npm run check
      - run: runtime/rust/build-apple-dynamic-xcframework.sh
      - name: Test iOS SDK
        shell: bash
        run: |
          set -o pipefail
          if ! swift test 2>&1 | tee /tmp/gamealgo-swift-test.log; then
            message="$(tail -n 60 /tmp/gamealgo-swift-test.log | perl -0pe 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=Swift tests failed::$message"
            exit 1
          fi
      - run: brew install lua luarocks
      - run: luarocks install lua-cjson
      - run: lua lua/tests/GameAlgoContractTest.lua
