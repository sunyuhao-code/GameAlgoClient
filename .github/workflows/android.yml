name: Android CI

"on":
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-release.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile Android SDK
        working-directory: android
        run: |
          mkdir -p /tmp/gamealgo-android-classes
          javac \
            -d /tmp/gamealgo-android-classes \
            src/main/java/com/gamealgo/sdk/*.java \
            src/test/java/com/gamealgo/sdk/*.java

      - name: Run Android smoke tests
        working-directory: android
        run: |
          java \
            -cp /tmp/gamealgo-android-classes \
            com.gamealgo.sdk.GameAlgoClientSmokeTest

      - name: Build release AAR
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify release AAR
        working-directory: android
        run: |
          aar=build/outputs/aar/gamealgo-android-release.aar
          test -f "$aar"
          unzip -p "$aar" classes.jar > /tmp/gamealgo-android-classes.jar
          jar tf /tmp/gamealgo-android-classes.jar | grep -q 'com/gamealgo/sdk/GameAlgoClient.class'
          if jar tf /tmp/gamealgo-android-classes.jar | grep -q 'JavaxScriptGameAlgoRuntime'; then
            echo "Desktop-only JavaxScriptGameAlgoRuntime must not be packaged in the AAR" >&2
            exit 1
          fi

      - name: Upload release AAR
        uses: actions/upload-artifact@v6
        with:
          name: gamealgo-android-${{ github.sha }}
          path: android/build/outputs/aar/gamealgo-android-release.aar
          if-no-files-found: error
