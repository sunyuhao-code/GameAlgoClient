name: Android CI

"on":
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-release.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile Android SDK
        working-directory: android
        run: |
          mkdir -p /tmp/gamealgo-android-classes
          javac \
            -d /tmp/gamealgo-android-classes \
            src/main/java/com/gamealgo/sdk/*.java \
            src/test/java/com/gamealgo/sdk/*.java

      - name: Run Android smoke tests
        working-directory: android
        run: |
          java \
            -cp /tmp/gamealgo-android-classes \
            com.gamealgo.sdk.GameAlgoClientSmokeTest

      - name: Test release AAR integration
        working-directory: android
        run: ./test-aar-integration.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run AAR integration on Android 7
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd android && ./gradlew --no-daemon :demo:connectedDebugAndroidTest -PgameAlgoAar="$GITHUB_WORKSPACE/android/build/outputs/aar/gamealgo-android-release.aar"

      - name: Upload demo APK
        uses: actions/upload-artifact@v6
        with:
          name: gamealgo-android-demo-${{ github.sha }}
          path: android/demo/build/outputs/apk/debug/demo-debug.apk
          if-no-files-found: error

      - name: Upload release AAR
        uses: actions/upload-artifact@v6
        with:
          name: gamealgo-android-${{ github.sha }}
          path: android/build/outputs/aar/gamealgo-android-release.aar
          if-no-files-found: error
