name: Publish JavaScript npm

on:
  # Releases created by a workflow with GITHUB_TOKEN do not emit a second
  # workflow run, so the normal tag path follows the completed Release job.
  workflow_run:
    workflows: [Release]
    types: [completed]
  # Keep the same entry points as GameAlgoCli for manually published releases
  # and an explicit operator retry.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm install --global npm@latest
      - run: npm --version
      - run: npm ci

      - run: npm run check:web
      - run: npm run check:web:pack

      - run: npm run check:wechat
      - run: npm run check:wechat:pack

      - run: npm run check:crazygames
      - run: npm run check:crazygames:pack

      - run: npm run check:douyin
      - run: npm run check:douyin:pack

      - name: Publish GamePropel packages and the legacy Web entry
        shell: bash
        run: |
          set -euo pipefail
          # Publish the independent host packages before the legacy entry, which uses its
          # existing trusted publisher in the old npm organization.
          for package_directory in taptap-h5 wechat crazygames douyin web; do
            package_name="$(node -p "require('./$package_directory/package.json').name")"
            package_version="$(node -p "require('./$package_directory/package.json').version")"
            if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
              echo "$package_name@$package_version is already published; skipping"
              continue
            fi
            npm publish "./$package_directory" --access public
          done
