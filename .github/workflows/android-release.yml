name: Android Release

"on":
  push:
    tags:
      - "v*.*.*"
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android

      - name: Set up Android native toolchain
        run: |
          cargo install cargo-ndk --locked
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Run Android smoke tests
        working-directory: android
        run: |
          classes="$(mktemp -d)"
          javac \
            -d "$classes" \
            src/main/java/com/gamealgo/sdk/*.java \
            src/test/java/com/gamealgo/sdk/*.java
          java -cp "$classes" com.gamealgo.sdk.GameAlgoClientSmokeTest

      - name: Build release AAR
        working-directory: android
        run: ./gradlew --no-daemon :assembleRelease -PsdkVersion=${{ steps.version.outputs.value }}

      - name: Verify packaged native runtime
        working-directory: android
        run: ./verify-native-runtime.sh build/outputs/aar/gamealgo-android-release.aar

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release
          asset="gamealgo-android-${{ steps.version.outputs.value }}.aar"
          cp android/build/outputs/aar/gamealgo-android-release.aar "release/$asset"
          unzip -p "release/$asset" classes.jar > /tmp/gamealgo-android-classes.jar
          jar tf /tmp/gamealgo-android-classes.jar | grep -q 'com/gamealgo/sdk/GameAlgoClient.class'
          if jar tf /tmp/gamealgo-android-classes.jar | grep -q 'JavaxScriptGameAlgoRuntime'; then
            echo "Desktop-only JavaxScriptGameAlgoRuntime must not be packaged in the AAR" >&2
            exit 1
          fi
          sha256sum "release/$asset" > "release/$asset.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release/* \
              --verify-tag \
              --generate-notes \
              --title "GameAlgo Client $GITHUB_REF_NAME"
          fi
