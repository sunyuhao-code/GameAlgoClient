[package]
name = "gamealgo-script-runtime"
version = "1.0.0"
edition = "2024"
license = "Proprietary"

[lib]
name = "gamealgo_script_runtime"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "gamealgo-script-runtime"
path = "src/main.rs"

[dependencies]
gamealgo-js-engine = { package = "rquickjs", version = "0.12.2", default-features = false, features = ["std", "bindgen", "parallel"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21.1", default-features = false }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
