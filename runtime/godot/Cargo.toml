[package]
name = "gamealgo-godot-runtime"
version = "1.0.0"
edition = "2024"
license = "Proprietary"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5.5", default-features = false, features = ["api-4-7"] }
gamealgo-script-runtime = { path = "../rust" }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
strip = "symbols"
