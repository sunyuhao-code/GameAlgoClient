plugins {
    id "com.android.library" version "8.7.3" apply false
    id "com.android.application" version "8.7.3" apply false
}

group = "ai.dirichlet.gamealgo"
version = providers.gradleProperty("GAMEALGO_ANDROID_VERSION").getOrElse("1.0.0-SNAPSHOT")

apply plugin: "com.android.library"
apply plugin: "maven-publish"

android {
    namespace = "ai.dirichlet.gamealgo"
    compileSdk = 35

    defaultConfig {
        minSdk = 24
        aarMetadata {
            minCompileSdk = 35
        }
        consumerProguardFiles("consumer-rules.pro")
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    sourceSets {
        main.jniLibs.srcDirs = ["src/main/jniLibs"]
        androidTest.assets.srcDirs += ["../protocol/fixtures"]
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

tasks.register("buildRustRuntime", Exec) {
    group = "build"
    description = "Builds the canonical Rust QuickJS runtime for Android ABIs."
    workingDir = file("../runtime/rust")
    commandLine(
        "cargo", "ndk",
        "-t", "armeabi-v7a",
        "-t", "arm64-v8a",
        "-t", "x86_64",
        "--platform", "24",
        "-o", "../../android/src/main/jniLibs",
        "build", "--release"
    )
}

tasks.named("preBuild").configure {
    dependsOn("buildRustRuntime")
}

tasks.register("releaseArtifacts") {
    group = "publishing"
    description = "Builds the release AAR, sample APK, and local Maven repository."
    dependsOn("assembleRelease", ":sample:assembleRelease", "publishReleasePublicationToLocalReleaseRepository")
}

tasks.register("verifyReleaseAar") {
    group = "verification"
    description = "Verifies that the release AAR contains the supported native runtime ABIs."
    dependsOn("assembleRelease")
    doLast {
        def aar = fileTree(layout.buildDirectory.dir("outputs/aar")).matching { include "*-release.aar" }.singleFile
        def entries = zipTree(aar).files.collect { it.path.replace('\\', '/') }
        ["armeabi-v7a", "arm64-v8a", "x86_64"].each { abi ->
            def suffix = "/jni/${abi}/libgamealgo_script_runtime.so"
            if (!entries.any { it.endsWith(suffix) }) {
                throw new GradleException("Release AAR is missing ${suffix}")
            }
        }
        def classesJar = zipTree(aar).matching { include "classes.jar" }.singleFile
        def classEntries = zipTree(classesJar).files.collect { it.path.replace('\\', '/') }
        if (!classEntries.any { it.endsWith("/META-INF/THIRD_PARTY_NOTICES.txt") }) {
            throw new GradleException("Release AAR is missing META-INF/THIRD_PARTY_NOTICES.txt")
        }
    }
}

dependencies {
    androidTestImplementation("androidx.test:runner:1.6.2")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    testImplementation("junit:junit:4.13.2")
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.group
                artifactId = "gamealgo-android"
                version = project.version
                pom {
                    name = "GameAlgo Android SDK"
                    description = "GameAlgo configuration, experiment, DDA, and analytics SDK for Android."
                    url = "https://github.com/sunyuhao-code/GameAlgoClient"
                    licenses {
                        license {
                            name = "Proprietary"
                            distribution = "repo"
                        }
                    }
                    scm {
                        url = "https://github.com/sunyuhao-code/GameAlgoClient"
                        connection = "scm:git:git://github.com/sunyuhao-code/GameAlgoClient.git"
                        developerConnection = "scm:git:ssh://github.com/sunyuhao-code/GameAlgoClient.git"
                    }
                }
            }
        }
        repositories {
            maven {
                name = "localRelease"
                url = layout.buildDirectory.dir("repo")
            }
        }
    }
}
