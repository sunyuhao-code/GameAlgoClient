openapi: 3.1.0
info:
  title: GameAlgo Protocol API
  version: 1.0.0
  description: Minimal Protocol v1 contract for GameAlgo clients and servers.
servers:
  - url: https://gamealgo.example.com
security:
  - gameKey: []
paths:
  /v1/integration/status/{miniGameId}:
    get:
      summary: Read a mini-game's Agent-declared completion flag without a Key or CLI.
      description: Unknown IDs and games without a completion declaration return completed=false. This does not prove the game was never integrated. Ambiguous bindings, unavailable games and storage errors are returned as errors. This operation never provisions a game.
      operationId: fetchMiniGameIntegrationStatus
      security: []
      parameters:
        - name: miniGameId
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
      responses:
        "200":
          description: Only the mini-game completion flag and caller-supplied ID. A mini-game ID identifies one Maker or H5 game. No platform parameter, internal game ID or credentials.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, miniGameId, completed]
                properties:
                  ok: { type: boolean, const: true }
                  miniGameId: { type: string }
                  completed: { type: boolean }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The mini-game ID maps to multiple games; no target is selected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerError"

  /v1/integration/status:
    get:
      summary: Read the Agent-declared initial integration status for this SDK Key's game.
      description: Does not require a management key. The Agent registers completion through the management API after acceptance. A false marker means not registered and does not prove this game has never integrated.
      operationId: fetchIntegrationStatus
      parameters:
        - name: platform
          in: query
          description: Required for all-platform keys; otherwise defaults to the key's platform.
          schema:
            type: string
            enum: [ios, android, maker, web, wechat, crazygames, douyin]
      responses:
        "200":
          description: Stored Agent completion declaration. No player data or credentials are returned.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, gameId, platform, completed, completedAt, sdkVersion]
                properties:
                  ok: { type: boolean, const: true }
                  gameId: { type: string }
                  platform: { type: string, enum: [ios, android, maker, web, wechat, crazygames, douyin] }
                  completed: { type: boolean }
                  completedAt: { type: [string, "null"], format: date-time }
                  sdkVersion: { type: [string, "null"] }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/MissingGameKey"
        "403":
          $ref: "#/components/responses/InvalidGameKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerError"

  /v1/config:
    post:
      summary: Fetch game config, experiment assignments, and config file metadata.
      operationId: fetchConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigRequest"
      responses:
        "200":
          description: Config response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/MissingGameKey"
        "403":
          $ref: "#/components/responses/InvalidGameKey"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/config-files/{fileName}:
    get:
      summary: Fetch one config file for the game resolved from X-GameAlgo-Key.
      operationId: fetchConfigFile
      parameters:
        - name: fileName
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
      responses:
        "200":
          description: Config file content.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/MissingGameKey"
        "403":
          $ref: "#/components/responses/InvalidGameKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/events/batch:
    post:
      summary: Upload game events in batches.
      description: >
        New ad_view integrations first register this game's placements through
        the management CLI, then send the returned adPlacementId and per-view
        revenue. Registration is not performed by this endpoint. The server
        resolves placement name, adType and currency from the authenticated
        game's registry before storing the event.
      operationId: uploadEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventBatchRequest"
            examples:
              registeredAdView:
                summary: Debug exposure referencing a placement registered for this game; IDs are illustrative.
                value:
                  events:
                    - eventId: "00000000-0000-0000-0000-000000000002"
                      contextId: ctx-001
                      userId: user-001
                      sessionId: session-001
                      eventType: ad_view
                      isDebug: true
                      timestamp: "2026-11-18T10:00:00Z"
                      payload:
                        adPlacementId: gap_0123456789abcdef0123456789abcdef
                        revenue: 0.125
                        network: max
                        trackId: track-123
                        level: 7
      responses:
        "200":
          description: Entire batch acknowledged after valid rows were written and terminal row rejections were resolved. Do not retry rejected rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventBatchResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/MissingGameKey"
        "403":
          $ref: "#/components/responses/InvalidGameKey"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/AdPlacementUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/diagnostics/init:
    post:
      summary: Upload an SDK initialization failure or recovery without requiring a config context.
      operationId: uploadSdkInitDiagnostic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SdkInitDiagnosticRequest"
      responses:
        "200":
          description: Accepted diagnostic count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventBatchResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/MissingGameKey"
        "403":
          $ref: "#/components/responses/InvalidGameKey"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/diagnostics/sdk:
    post:
      summary: Upload a general SDK diagnostic, including local event-guard rejections.
      operationId: uploadSdkDiagnostic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SdkInitDiagnosticRequest"
      responses:
        "200":
          description: Accepted diagnostic count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventBatchResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/MissingGameKey"
        "403":
          $ref: "#/components/responses/InvalidGameKey"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/scripts/{versionId}:
    get:
      summary: Fetch one immutable experiment script by version id.
      operationId: fetchExperimentScript
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
      responses:
        "200":
          description: Immutable JavaScript content. Clients must verify the assignment hash before execution.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/javascript:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/MissingGameKey"
        "403":
          $ref: "#/components/responses/InvalidGameKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/attribution:
    post:
      summary: Sync user attribution returned by attribution SDKs such as Adjust.
      operationId: syncUserAttribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAttributionRequest"
      responses:
        "200":
          description: Accepted attribution update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAttributionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/MissingGameKey"
        "403":
          $ref: "#/components/responses/InvalidGameKey"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/context-identifiers:
    post:
      summary: Sync one asynchronous SDK/device identifier for the active user and context.
      operationId: syncContextIdentifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextIdentifierRequest"
      responses:
        "200":
          description: Accepted identifier update or deletion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextIdentifierResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/MissingGameKey"
        "403":
          $ref: "#/components/responses/InvalidGameKey"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/multiplayer/access-token:
    post:
      summary: Issue a short-lived token for the regional Match Controller.
      operationId: issueMultiplayerAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiplayerAccessTokenRequest"
      responses:
        "200":
          description: A signed access token and Match Controller WebSocket URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiplayerAccessTokenResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/MissingGameKey"
        "403":
          $ref: "#/components/responses/InvalidGameKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    gameKey:
      type: apiKey
      in: header
      name: X-GameAlgo-Key

  responses:
    InvalidRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MissingGameKey:
      description: Missing X-GameAlgo-Key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidGameKey:
      description: Unknown or revoked game key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdPlacementUnavailable:
      description: >
        ad_placement_unavailable means placement lookup failed (storage error).
        The batch was not acknowledged or stored; retry using the same event IDs.
        Unresolved placement IDs on individual ad_view events are filtered per
        event as ad_placement_unresolved in EventBatchResponse.filtered.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    MultiplayerAccessTokenRequest:
      type: object
      required: [userId, sessionId]
      properties:
        userId:
          type: string
          minLength: 1
          maxLength: 128
        sessionId:
          type: string
          minLength: 1
          maxLength: 128
        region:
          type: string
          minLength: 1
          maxLength: 128

    MultiplayerAccessTokenResponse:
      type: object
      required: [accessToken, expiresAt, controllerUrl]
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        controllerUrl:
          type: string
          format: uri

    ConfigRequest:
      type: object
      required:
        - userId
        - sessionId
        - platform
        - sdkVersion
      properties:
        userId:
          type: string
          minLength: 1
        isOldUser:
          type: boolean
          description: Optional SDK initialization classification. True means pre-existing game progress; false means a confirmed new player. Persist the first explicit value and omit when unknown. Only the new_user milestone funnel excludes true.
        userCreatedAt:
          type: string
          format: date-time
        userCreatedLocalAt:
          type: string
          description: User creation time reported with the device UTC offset.
        accountUserId:
          type: string
          description: Optional game account identifier. The SDK-generated userId remains the analytics identity.
        accountUserCreatedAt:
          type: string
          format: date-time
        createdLocalAt:
          type: string
          description: Context creation time reported with the device UTC offset.
        sessionId:
          type: string
          minLength: 1
        platform:
          type: string
          enum: [ios, android, maker, web, wechat, crazygames, douyin]
        sdkVersion:
          type: string
          minLength: 1
        appVersion:
          type: string
        experimentIntegrationVersion:
          type: integer
          minimum: 0
        timezone:
          type: string
        device:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
        isDebug:
          type: boolean
          default: false

    ConfigResponse:
      type: object
      required:
        - contextId
        - gameId
        - environment
        - configVersion
        - ttlSeconds
        - serverTime
        - experiments
        - configFiles
      properties:
        contextId:
          type: string
        gameId:
          type: string
        environment:
          type: string
          enum: [test, live]
        configVersion:
          type: string
        ttlSeconds:
          type: integer
          minimum: 0
        serverTime:
          type: string
          format: date-time
        gamealgoStandardReportingEnabled:
          type: boolean
          description: Maker/TapTap H5 standard telemetry (including attribution, identifier links and diagnostics) gate. Only explicit false disables this category.
          default: true
        gamealgoCustomReportingEnabled:
          type: boolean
          description: Maker/TapTap H5 custom business event gate. Only explicit false disables this category.
          default: true
        tapdbStandardReportingEnabled:
          type: boolean
          description: Maker/TapTap H5 standard telemetry (including attribution, identifier links and diagnostics) gate. Only boolean true in a fresh successful response enables this category.
          default: false
        tapdbCustomReportingEnabled:
          type: boolean
          description: Maker/TapTap H5 custom business event gate. Only boolean true in a fresh successful response enables this category.
          default: false
        tapdbContextLinkEnabled:
          type: boolean
          description: Legacy best-effort TapDB identity link, requires tapdbStandardReportingEnabled true. This does not enable general telemetry mirroring.
          default: false
        eventQuota:
          $ref: "#/components/schemas/EventQuotaConfig"
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/ExperimentAssignment"
        configFiles:
          type: array
          items:
            $ref: "#/components/schemas/ConfigFileRef"

    EventQuotaConfig:
      type: object
      required:
        - mode
        - policyVersion
        - ordinaryEventLimit
        - quotaDate
        - resetAt
        - exemptEventTypes
      properties:
        mode:
          type: string
          enum: [off, shadow, enforce]
        policyVersion:
          type: integer
          minimum: 0
        ordinaryEventLimit:
          type: integer
          minimum: 0
        quotaDate:
          type: string
          format: date
        resetAt:
          type: string
          format: date-time
        exemptEventTypes:
          type: array
          description: Event types excluded from the ordinary event quota; currently purchase, ad_view and session_end.
          items:
            type: string

    ExperimentAssignment:
      type: object
      required:
        - key
        - experimentId
        - variant
        - config
      properties:
        key:
          type: string
        experimentId:
          type: string
        variant:
          type: string
        config:
          $ref: "#/components/schemas/JsonValue"
        script:
          $ref: "#/components/schemas/ScriptFileRef"

    ScriptFileRef:
      type: object
      required: [versionId, name, url, hash]
      properties:
        versionId:
          type: string
          minLength: 1
        name:
          type: string
        url:
          type: string
          format: uri-reference
        hash:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        contentType:
          type: string
        updatedAt:
          type: string

    ConfigFileRef:
      type: object
      required:
        - name
        - url
        - hash
      properties:
        versionId:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri-reference
        hash:
          type: string
        contentType:
          type: string
        updatedAt:
          type: string

    EventBatchRequest:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/GameEvent"

    EventBatchResponse:
      type: object
      required:
        - ok
        - accepted
        - rejected
      properties:
        ok:
          type: boolean
        accepted:
          type: integer
          minimum: 0
          description: For /v1/events/batch, the acknowledged row count including terminal rejections, equal to the submitted batch size on success. This lets legacy SDKs drain the entire batch. Use stored for the actual written count. Diagnostic endpoints retain their diagnostic-count semantics.
        stored:
          type: integer
          minimum: 0
          description: Actual number of events successfully written to the event sink. Present on /v1/events/batch responses; stored + sum(filtered[].count) = accepted, treating an omitted filtered as zero. Omitted by older servers and diagnostic endpoints.
        rejected:
          type: array
          maxItems: 0
          description: Compatibility array, always empty on successful /v1/events/batch responses. This satisfies both legacy accepted == submitted and accepted + rejected.length == submitted ACK checks. Terminal filtering is summarized separately in filtered and must not trigger retries.
          items:
            $ref: "#/components/schemas/RejectedEvent"
        filtered:
          type: array
          minItems: 1
          maxItems: 6
          description: Terminally filtered events grouped by code only, without per-event index, eventId or reason. Omitted when nothing was filtered. Every filtered row is already acknowledged in accepted and must not be retried.
          items:
            type: object
            required: [code, count]
            additionalProperties: false
            properties:
              code:
                type: string
                enum: [invalid_event, unregistered_event, blocked_event, deprecated_event, daily_event_limit_exceeded, ad_placement_unresolved]
              count:
                type: integer
                minimum: 1

    RejectedEvent:
      type: object
      required:
        - index
        - reason
      properties:
        index:
          type: integer
          minimum: 0
        eventId:
          type: string
        code:
          type: string
          enum: [invalid_event, unregistered_event, blocked_event, deprecated_event, daily_event_limit_exceeded, ad_placement_unresolved]
        reason:
          type: string

    GameEvent:
      type: object
      description: >
        Common envelope for all events. ad_view requires a registered placement
        ID and per-view revenue, as specified by AdViewPayload.
      required:
        - eventId
        - contextId
        - userId
        - sessionId
        - eventType
        - timestamp
        - payload
      properties:
        eventId:
          type: string
        contextId:
          type: string
        userId:
          type: string
        sessionId:
          type: string
        eventType:
          type: string
        isDebug:
          type: boolean
          default: false
        timestamp:
          type: string
          format: date-time
        createdLocalAt:
          type: string
          description: Event time reported with the device UTC offset.
        accountUserId:
          type: string
        payload:
          type: object
          description: >
            Flat or JSON event properties. For ad_view with a registered
            adPlacementId, the server adds or overrides placement, adType and
            currency from this game's placement definition before storage;
            revenue is not converted. Standard enum validation and display
            mapping happen in event catalogs and reports rather than rejecting
            raw telemetry at ingestion.
          additionalProperties:
            $ref: "#/components/schemas/EventPayloadValue"
      allOf:
        - if:
            required: [eventType]
            properties:
              eventType:
                const: ad_view
          then:
            properties:
              payload:
                $ref: "#/components/schemas/AdViewPayload"

    RegisteredAdViewEvent:
      description: ad_view contract; use this game's CLI registration result as the placement ID.
      allOf:
        - $ref: "#/components/schemas/GameEvent"
        - type: object
          properties:
            eventType:
              const: ad_view
            payload:
              $ref: "#/components/schemas/AdViewPayload"

    AdViewPayload:
      type: object
      description: >
        Register the placement during integration, not during each exposure.
        Use the returned stable ID from the authenticated game, never a business
        key/name, host adUnitId or another game's ID. The server supplies static
        placement name, adType and currency. Additional properties are per-view
        dynamic facts.
      required: [adPlacementId, revenue]
      properties:
        adPlacementId:
          type: string
          minLength: 36
          maxLength: 36
          pattern: "^gap_[a-f0-9]{32}$"
          description: Stable placement ID returned by this game's management registration.
        revenue:
          type: number
          description: Actual per-view revenue in the registered currency; no automatic currency conversion.
        network:
          type: string
        trackId:
          type: string
          description: Original per-exposure identifier from the ad provider, when available.
      additionalProperties:
        $ref: "#/components/schemas/EventPayloadValue"

    EventPayloadValue:
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: "null"
        - type: array
          items:
            $ref: "#/components/schemas/EventPayloadValue"
        - type: object
          additionalProperties:
            $ref: "#/components/schemas/EventPayloadValue"

    SdkInitDiagnosticRequest:
      type: object
      required:
        - diagnosticId
        - sessionId
        - platform
        - sdkVersion
        - stage
        - status
        - reasonCode
        - createdAt
      properties:
        diagnosticId:
          type: string
          minLength: 1
        correlationId:
          type: string
          description: Original diagnosticId when status is recovered.
        userId:
          type: string
          description: Optional because SDK identity storage may not be ready.
        accountUserId:
          type: string
          description: Optional Maker/platform account identity captured before asynchronous storage.
        sessionId:
          type: string
          minLength: 1
        contextId:
          type: string
          description: Optional because the failure may happen before config succeeds.
        platform:
          type: string
          enum: [ios, android, maker, web, wechat, crazygames, douyin]
        sdkVersion:
          type: string
        appVersion:
          type: string
        stage:
          type: string
          enum: [storage, config, transport, event_guard]
        status:
          type: string
          enum: [degraded, failed, recovered]
        reasonCode:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
        reasonDetail:
          type: string
          maxLength: 256
        attempts:
          type: integer
          minimum: 0
          maximum: 100
        createdAt:
          type: string
          format: date-time
        createdLocalAt:
          type: string
          format: date-time
        isDebug:
          type: boolean

    UserAttributionRequest:
      type: object
      required:
        - userId
        - platform
        - provider
        - attribution
      properties:
        userId:
          type: string
          minLength: 1
        userCreatedAt:
          type: string
          format: date-time
        sessionId:
          type: string
        contextId:
          type: string
        platform:
          type: string
          enum: [ios, android, maker, web, wechat, crazygames, douyin]
        provider:
          type: string
          example: adjust
        status:
          type: string
          default: attributed
        attribution:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
        attributedAt:
          type: string
          format: date-time
        attributionHash:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"

    UserAttributionResponse:
      type: object
      required:
        - ok
        - accepted
        - attributionHash
      properties:
        ok:
          type: boolean
        accepted:
          type: integer
          minimum: 0
        attributionHash:
          type: string

    ContextIdentifierRequest:
      type: object
      required:
        - userId
        - sessionId
        - contextId
        - platform
        - identifierType
        - identifierValue
      properties:
        userId:
          type: string
          minLength: 1
          description: GameAlgo userId; this is also the GameAlgo device identifier.
        sessionId:
          type: string
          minLength: 1
        contextId:
          type: string
          minLength: 1
        platform:
          type: string
          enum: [ios, android, maker, web, wechat, crazygames, douyin]
        identifierType:
          type: string
          enum: [adjust_adid, firebase_app_instance_id, gaid, idfa, idfv, oaid, caid]
        identifierValue:
          type: [string, "null"]
          description: >-
            Null clears the latest mapping. OAID is a scalar string. CAID is a
            JSON-encoded non-empty array of objects with caid and version string
            fields, unique versions and no surrounding whitespace in either field.
            SDKs serialize the structured CAID input; null or an empty list clears
            the mapping. CAID strings are limited to 512 UTF-8 bytes and values
            are not additionally hashed or rewritten.
        observedAt:
          type: string
          format: date-time
        identifierHash:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"

    ContextIdentifierResponse:
      type: object
      required:
        - ok
        - accepted
        - identifierHash
      properties:
        ok:
          type: boolean
        accepted:
          type: integer
          minimum: 0
        identifierHash:
          type: string

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - missing_game_key
            - invalid_game_key
            - not_found
            - rate_limited
            - server_error
        message:
          type: string

    JsonValue:
      description: Any valid JSON value.
